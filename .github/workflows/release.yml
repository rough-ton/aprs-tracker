name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."10.0.20.100:5000"]
              http = true
              insecure = true

      - name: Build and push
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          push: true
          tags: 10.0.20.100:5000/aprs-tracker:latest
          build-args: |
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
            BUILD_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Sync compose file
        run: cp ${{ github.workspace }}/docker-compose.yml /runner/persistent_files/docker-compose.yml

      - name: Deploy latest image
        run: |
          cd /runner/persistent_files
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f